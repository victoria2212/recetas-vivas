<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetas Vivas · Nueva receta</title>
  <link rel="stylesheet" href="css/styles.css">


  <script src="js/preferencias.js" defer></script>
  <script src="js/tema.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/recetas.js" defer></script>
  <script src="js/nueva-receta.js" defer></script>
</head>
<body>
  <header>
    <a href="app.html">← Mis recetas</a>
    <div class="acciones-encabezado">
      <button id="btn-tema" class="boton-icono" type="button" aria-label="Modo oscuro" aria-pressed="false" title="Modo oscuro">
        <!-- Luna (se ve en modo claro) y sol (se ve en modo oscuro) -->
        <svg class="icono-luna" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icono-sol" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="btn-salir" type="button">Cerrar sesión</button>
    </div>
  </header>

  <main>

    <h1 id="titulo-pagina">Nueva receta</h1>

    <!-- Solo en modo edición: mientras se trae la receta -->
    <p id="estado-carga" class="estado" hidden>Cargando receta...</p>

    <!-- Solo en modo edición: si la receta no existe, no es del usuario
         o falla la conexión. Reemplaza al formulario. -->
    <div id="error-carga" class="estado" hidden>
      <p id="texto-error-carga" class="error"></p>
      <a href="app.html" class="boton">Volver a Mis recetas</a>
    </div>

    <!-- novalidate: desactiva los globos de error del navegador.
         La validación la hace nuestro JavaScript, que muestra los
         mensajes en la página (sin alert). -->
    <form id="form-receta" novalidate>

      <!-- ===== Datos generales ===== -->
      <fieldset>
        <legend>Datos generales</legend>

        <label for="titulo">Título *</label>
        <input id="titulo" name="titulo" type="text" maxlength="120" required>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="3"></textarea>

        <!-- Opcional: a veces todavía no se tiene la foto del resultado final.
             Se puede agregar más adelante, al editar la receta. -->
        <label for="imagen-principal">Imagen del resultado final (opcional · JPG, PNG o WebP, máx. 5 MB)</label>
        <!-- accept: el selector de archivos muestra solo imágenes de estos tipos -->
        <input id="imagen-principal" name="imagen-principal" type="file"
               accept="image/jpeg,image/png,image/webp">
        <!-- Vista previa: oculta hasta que se elige una imagen -->
        <img id="vista-principal" class="vista-previa" alt="Vista previa de la imagen principal" hidden>

        <!-- Solo en modo edición y si la receta ya tenía imagen:
             muestra la actual con la opción de quitarla. Elegir un
             archivo arriba la reemplaza. -->
        <div id="imagen-principal-actual" class="imagen-actual" hidden>
          <p class="texto-ayuda">Imagen actual (si elige otra arriba, la reemplaza):</p>
          <img id="img-principal-actual" class="miniatura" alt="Imagen principal actual">
          <label class="opcion">
            <input id="quitar-imagen-principal" type="checkbox">
            Quitar la imagen actual
          </label>
        </div>

        <label class="opcion">
          <input id="es-publica" type="checkbox">
          Receta pública (cualquiera puede verla). Si no se marca, es privada.
        </label>
      </fieldset>

      <!-- ===== Ingredientes =====
           El contenedor empieza vacío: JavaScript agrega las filas. -->
      <fieldset>
        <legend>Ingredientes *</legend>
        <div id="lista-ingredientes"></div>
        <button id="btn-agregar-ingrediente" type="button">+ Agregar ingrediente</button>
      </fieldset>

      <!-- ===== Pasos =====
           <ol> es una lista numerada: el navegador numera los pasos solo. -->
      <fieldset>
        <legend>Paso a paso *</legend>
        <ol id="lista-pasos"></ol>
        <button id="btn-agregar-paso" type="button">+ Agregar paso</button>
      </fieldset>

      <p id="mensaje-error" class="error" hidden></p>
      <div class="acciones-formulario">
        <button id="btn-guardar" type="submit">Guardar receta</button>
        <!-- En modo edición, JavaScript cambia el destino a la receta -->
        <a id="btn-cancelar" href="app.html" class="boton">Cancelar</a>
      </div>
    </form>
  </main>

  <!-- ===== Plantillas =====
       <template> no se muestra en la página: es un molde que JavaScript
       copia cada vez que se agrega una fila. Así el HTML de la fila está
       escrito en un solo lugar y no hay que armarlo con texto en el código. -->
  <template id="plantilla-ingrediente">
    <div class="fila-ingrediente">
      <!-- step="any" permite decimales (0.5, 1.25) -->
      <input class="ing-cantidad" type="number" min="0.01" step="any" placeholder="Cant." aria-label="Cantidad">
      <!-- list="unidades" conecta el campo con las sugerencias del datalist -->
      <input class="ing-unidad" type="text" list="unidades" placeholder="Unidad" aria-label="Unidad">
      <input class="ing-nombre" type="text" placeholder="Ingrediente *" aria-label="Ingrediente" required>
      <input class="ing-nota" type="text" placeholder="Nota (a gusto, picada fina...)" aria-label="Nota">
      <button class="btn-quitar" type="button" aria-label="Quitar ingrediente">✕</button>
    </div>
  </template>

  <template id="plantilla-paso">
    <li class="fila-paso">
      <textarea class="paso-descripcion" rows="2" placeholder="Describa el paso *" aria-label="Descripción del paso" required></textarea>
      <!-- Solo en modo edición y si el paso ya tenía imagen.
           La ruta de esa imagen se guarda en data-imagen-actual del <li>. -->
      <div class="paso-imagen-actual imagen-actual" hidden>
        <img class="miniatura" alt="Imagen actual del paso">
        <label class="opcion">
          <input class="paso-quitar-imagen" type="checkbox">
          Quitar esta imagen
        </label>
      </div>
      <label class="paso-imagen-label">
        Imagen (opcional)
        <input class="paso-imagen" type="file" accept="image/jpeg,image/png,image/webp">
      </label>
      <button class="btn-quitar" type="button" aria-label="Quitar paso">✕</button>
    </li>
  </template>

  <!-- datalist: sugerencias para el campo "unidad".
       El usuario puede elegir una o escribir otra. -->
  <datalist id="unidades">
    <option value="g"><option value="kg"><option value="ml"><option value="l">
    <option value="taza"><option value="cda"><option value="cdta">
    <option value="pizca"><option value="unidad"><option value="diente">
  </datalist>

</body>
</html>
