<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetas Vivas · Nueva receta</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- ===== JavaScript =====
       defer: el navegador descarga estos archivos SIN frenar la lectura
       del HTML y los ejecuta recién cuando el HTML está completo, así
       los getElementById encuentran sus elementos.
       Los scripts con defer se ejecutan en el MISMO ORDEN en que están
       escritos, y el orden importa:
         1. Librería de Supabase → crea la variable global "supabase"
         2. config.js            → la usa para crear supabaseClient
         3. auth.js              → funciones de sesión (usa supabaseClient)
         4. recetas.js           → lectura y guardado de recetas
         5. nueva-receta.js      → lógica de esta página
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/recetas.js" defer></script>
  <script src="js/nueva-receta.js" defer></script>
</head>
<body>
  <header>
    <a href="app.html">← Mis recetas</a>
    <button id="btn-salir" type="button">Cerrar sesión</button>
  </header>

  <main>
    <h1>Nueva receta</h1>

    <!-- novalidate: desactiva los globos de error del navegador.
         La validación la hace nuestro JavaScript, que muestra los
         mensajes en la página (sin alert). -->
    <form id="form-receta" novalidate>

      <!-- ===== Datos generales ===== -->
      <fieldset>
        <legend>Datos generales</legend>

        <label for="titulo">Título *</label>
        <input id="titulo" name="titulo" type="text" maxlength="120" required>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="3"></textarea>

        <label for="imagen-principal">Imagen del resultado final * (JPG, PNG o WebP, máx. 5 MB)</label>
        <!-- accept: el selector de archivos muestra solo imágenes de estos tipos -->
        <input id="imagen-principal" name="imagen-principal" type="file"
               accept="image/jpeg,image/png,image/webp" required>
        <!-- Vista previa: oculta hasta que se elige una imagen -->
        <img id="vista-principal" class="vista-previa" alt="Vista previa de la imagen principal" hidden>

        <label class="opcion">
          <input id="es-publica" type="checkbox">
          Receta pública (cualquiera puede verla). Si no se marca, es privada.
        </label>
      </fieldset>

      <!-- ===== Ingredientes =====
           El contenedor empieza vacío: JavaScript agrega las filas. -->
      <fieldset>
        <legend>Ingredientes *</legend>
        <div id="lista-ingredientes"></div>
        <button id="btn-agregar-ingrediente" type="button">+ Agregar ingrediente</button>
      </fieldset>

      <!-- ===== Pasos =====
           <ol> es una lista numerada: el navegador numera los pasos solo. -->
      <fieldset>
        <legend>Paso a paso *</legend>
        <ol id="lista-pasos"></ol>
        <button id="btn-agregar-paso" type="button">+ Agregar paso</button>
      </fieldset>

      <p id="mensaje-error" class="error" hidden></p>
      <button id="btn-guardar" type="submit">Guardar receta</button>
    </form>
  </main>

  <!-- ===== Plantillas =====
       <template> no se muestra en la página: es un molde que JavaScript
       copia cada vez que se agrega una fila. Así el HTML de la fila está
       escrito en un solo lugar y no hay que armarlo con texto en el código. -->
  <template id="plantilla-ingrediente">
    <div class="fila-ingrediente">
      <!-- step="any" permite decimales (0.5, 1.25) -->
      <input class="ing-cantidad" type="number" min="0.01" step="any" placeholder="Cant." aria-label="Cantidad">
      <!-- list="unidades" conecta el campo con las sugerencias del datalist -->
      <input class="ing-unidad" type="text" list="unidades" placeholder="Unidad" aria-label="Unidad">
      <input class="ing-nombre" type="text" placeholder="Ingrediente *" aria-label="Ingrediente" required>
      <input class="ing-nota" type="text" placeholder="Nota (a gusto, picada fina...)" aria-label="Nota">
      <button class="btn-quitar" type="button" aria-label="Quitar ingrediente">✕</button>
    </div>
  </template>

  <template id="plantilla-paso">
    <li class="fila-paso">
      <textarea class="paso-descripcion" rows="2" placeholder="Describa el paso *" aria-label="Descripción del paso" required></textarea>
      <label class="paso-imagen-label">
        Imagen (opcional)
        <input class="paso-imagen" type="file" accept="image/jpeg,image/png,image/webp">
      </label>
      <button class="btn-quitar" type="button" aria-label="Quitar paso">✕</button>
    </li>
  </template>

  <!-- datalist: sugerencias para el campo "unidad".
       El usuario puede elegir una o escribir otra. -->
  <datalist id="unidades">
    <option value="g"><option value="kg"><option value="ml"><option value="l">
    <option value="taza"><option value="cda"><option value="cdta">
    <option value="pizca"><option value="unidad"><option value="diente">
  </datalist>

</body>
</html>
