<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetas Vivas · Mi emprendimiento</title>
  <link rel="stylesheet" href="css/styles.css">

  <script src="js/preferencias.js" defer></script>
  <script src="js/tema.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/recetas.js" defer></script>
  <script src="js/perfil.js" defer></script>
  <script src="js/recorte-logo.js" defer></script>
  <script src="js/configuracion.js" defer></script>
</head>
<body>
  <header>
    <a href="app.html">← Mis recetas</a>
    <div class="acciones-encabezado">
      <button id="btn-tema" class="boton-icono" type="button" aria-label="Modo oscuro" aria-pressed="false" title="Modo oscuro">
        <svg class="icono-luna" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icono-sol" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="btn-salir" type="button">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <h1>Mi emprendimiento</h1>
    <p class="texto-ayuda">Estos datos aparecen en la portada de "Mis recetas".</p>

    <p id="estado-carga" class="estado">Cargando...</p>

    <div id="error-carga" class="estado" hidden>
      <p id="texto-error-carga" class="error"></p>
      <a href="app.html" class="boton">Volver a Mis recetas</a>
    </div>

    <form id="form-perfil" novalidate hidden>
      <fieldset>
        <legend>Datos del emprendimiento</legend>

        <label for="nombre-emprendimiento">Nombre del emprendimiento *</label>
        <input id="nombre-emprendimiento" type="text" maxlength="80" required>

        <label for="frase">Frase corta (opcional)</label>
        <input id="frase" type="text" maxlength="140" placeholder="Ej.: Pastelería casera con harinas agroecológicas">

        <!-- editor para acomodar el logo nuevo (recorte-logo.js) -->
        <div id="editor-logo" class="editor-logo" hidden>
          <canvas id="lienzo-logo" class="logo-vista lienzo-logo" width="400" height="400" tabindex="0"
                  aria-label="Logo nuevo. Arrástrelo o use las flechas del teclado para acomodarlo."></canvas>
          <label for="zoom-logo">Tamaño</label>
          <input id="zoom-logo" type="range" min="1" max="4" step="0.01" value="1">
          <p class="texto-ayuda">Arrastre el logo para acomodarlo.</p>
          <button id="btn-centrar-logo" type="button">Centrar</button>
        </div>

        <div id="logo-actual" class="imagen-actual" hidden>
          <img id="img-logo-actual" class="logo-vista" alt="Logo actual">
          <p class="texto-ayuda">Logo actual (si elige otro abajo, lo reemplaza).</p>
          <label class="opcion">
            <input id="quitar-logo" type="checkbox">
            Quitar el logo actual
          </label>
        </div>

        <label for="logo">Logo (opcional · JPG, PNG o WebP, máx. 5 MB)</label>
        <input id="logo" type="file" accept="image/jpeg,image/png,image/webp">
      </fieldset>

      <p id="mensaje-error" class="error" hidden></p>
      <div class="acciones-formulario">
        <button id="btn-guardar" type="submit">Guardar</button>
        <a href="app.html" class="boton">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
