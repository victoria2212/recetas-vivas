<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- El título de la pestaña se reemplaza con el de la receta al cargarla -->
  <title>Recetas Vivas · Receta</title>
  <link rel="stylesheet" href="css/styles.css">


  <script src="js/preferencias.js" defer></script>
  <script src="js/tema.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/recetas.js" defer></script>
  <script src="js/detalle.js" defer></script>
</head>
<body>
  <header>
    <a href="app.html">← Mis recetas</a>
    <div class="acciones-encabezado">
      <button id="btn-tema" class="boton-icono" type="button" aria-label="Modo oscuro" aria-pressed="false" title="Modo oscuro">
        <!-- Luna (se ve en modo claro) y sol (se ve en modo oscuro) -->
        <svg class="icono-luna" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icono-sol" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="btn-salir" type="button">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <!-- Aviso verde: solo se ve al volver de editar (?editada=1) -->
    <p id="mensaje-exito" class="exito" hidden>Cambios guardados.</p>

    <!-- ===== Estados de la página =====
         Solo uno se ve a la vez; JavaScript decide cuál. -->

    <!-- 1. Mientras llega la respuesta -->
    <p id="estado-carga" class="estado" hidden>Cargando receta...</p>

    <!-- 2. Si falla la conexión: mensaje + botón para volver a intentar -->
    <div id="error-receta" class="estado" hidden>
      <p id="texto-error-receta" class="error"></p>
      <button id="btn-reintentar" type="button">Reintentar</button>
    </div>

    <!-- 3. Si el id no existe o la receta es privada de otro usuario -->
    <div id="no-encontrada" class="estado" hidden>
      <p>No se encontró la receta. Puede que se haya borrado o que no tenga permiso para verla.</p>
      <a href="app.html" class="boton">Volver a Mis recetas</a>
    </div>

    <!-- 4. La receta. Empieza oculta y VACÍA: JavaScript completa cada parte. -->
    <article id="detalle-receta" hidden>

      <!-- Encabezado: imagen principal al lado del título -->
      <div class="encabezado-receta">
        <div id="contenedor-imagen"></div>
        <div class="info-receta">
          <span id="etiqueta-visibilidad" class="etiqueta"></span>
          <h1 id="titulo-receta"></h1>
          <p id="descripcion-receta"></p>

          <!-- Acciones del DUEÑO de la receta. Empiezan ocultas:
               JavaScript las muestra solo si el usuario logueado es el
               dueño. Ocultarlas es solo para la interfaz: la protección
               real la dan las políticas RLS de Supabase. -->
          <div id="acciones-propietario" class="acciones-receta" hidden>
            <!-- El destino (nueva-receta.html?id=...) lo completa JavaScript -->
            <a id="btn-editar" href="app.html" class="boton">Editar receta</a>
            <button id="btn-eliminar" type="button" class="boton-peligro">Eliminar receta</button>
          </div>

          <!-- Confirmación dentro de la página (la consigna no permite
               alert, prompt ni confirm). role="alertdialog" avisa a los
               lectores de pantalla que es una pregunta importante. -->
          <div id="confirmar-eliminar" class="confirmacion" role="alertdialog"
               aria-labelledby="texto-confirmar" hidden>
            <p id="texto-confirmar"></p>
            <p id="error-eliminar" class="error" hidden></p>
            <div class="acciones-receta">
              <button id="btn-confirmar-eliminar" type="button" class="boton-peligro relleno">Sí, eliminar</button>
              <button id="btn-cancelar-eliminar" type="button">Cancelar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Ingredientes con sus cantidades -->
      <section class="seccion-receta">
        <h2>Ingredientes</h2>
        <ul id="lista-ingredientes" class="lista-ingredientes"></ul>
      </section>

      <!-- Paso a paso. <ol> numera los pasos automáticamente. -->
      <section class="seccion-receta">
        <h2>Paso a paso</h2>
        <ol id="lista-pasos" class="lista-pasos"></ol>
      </section>
    </article>
  </main>

</body>
</html>
