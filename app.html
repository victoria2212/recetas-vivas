<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetas Vivas · Mis recetas</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- ===== JavaScript =====
       defer: el navegador descarga estos archivos SIN frenar la lectura
       del HTML y los ejecuta recién cuando el HTML está completo, así
       los getElementById encuentran sus elementos.
       Los scripts con defer se ejecutan en el MISMO ORDEN en que están
       escritos, y el orden importa:
         1. Librería de Supabase → crea la variable global "supabase"
         2. config.js            → la usa para crear supabaseClient
         3. auth.js              → funciones de sesión (usa supabaseClient)
         4. recetas.js           → lectura y guardado de recetas
         5. listado.js           → lógica de esta página
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/recetas.js" defer></script>
  <script src="js/listado.js" defer></script>
</head>
<body>
  <header>
    <span id="saludo">Cargando...</span>
    <button id="btn-salir" type="button">Cerrar sesión</button>
  </header>

  <main>
    <div class="encabezado-listado">
      <h1>Mis recetas</h1>
      <a href="nueva-receta.html" class="boton">+ Nueva receta</a>
    </div>

    <!-- Avisos generales -->
    <p id="mensaje-exito" class="exito" hidden>Receta guardada correctamente.</p>
    <p id="mensaje-error" class="error" hidden></p>

    <!-- Buscador + historial de búsquedas.
         El contenedor tiene position: relative para que la lista del
         historial se ubique justo debajo del campo, encima del listado. -->
    <div id="contenedor-buscador" class="contenedor-buscador">
      <label for="buscador" class="oculto-visual">Buscar recetas</label>
      <!-- type="search" agrega la ✕ para borrar en algunos navegadores.
           autocomplete="off" desactiva el historial propio del navegador:
           se usa el nuestro, guardado en localStorage. -->
      <input id="buscador" type="search" placeholder="Buscar por título..." autocomplete="off">

      <!-- Últimas búsquedas. Empieza VACÍA y oculta: JavaScript la
           completa y la muestra al hacer clic en el buscador. -->
      <ul id="historial-busquedas" class="historial-busquedas" aria-label="Búsquedas recientes" hidden></ul>
    </div>

    <!-- ===== Estados del listado =====
         Solo uno se ve a la vez; JavaScript decide cuál. -->

    <!-- 1. Mientras llega la respuesta de la API -->
    <p id="estado-carga" class="estado" hidden>Cargando recetas...</p>

    <!-- 2. Si la API falla: mensaje + botón para volver a intentar -->
    <div id="error-listado" class="estado" hidden>
      <p id="texto-error-listado" class="error"></p>
      <button id="btn-reintentar" type="button">Reintentar</button>
    </div>

    <!-- 3. Si el usuario todavía no cargó ninguna receta -->
    <p id="sin-recetas" class="estado" hidden>
      Todavía no tiene recetas. Empiece con "+ Nueva receta".
    </p>

    <!-- 4. Si la búsqueda no coincide con ninguna receta -->
    <p id="sin-resultados" class="estado" hidden></p>

    <!-- 5. Las tarjetas. Empieza VACÍO: JavaScript las dibuja a partir
            del array de recetas que devuelve la API. -->
    <div id="lista-recetas" class="grilla-recetas"></div>
  </main>

</body>
</html>
