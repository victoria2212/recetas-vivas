<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetas Vivas · Mis recetas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <span id="saludo">Cargando...</span>
    <button id="btn-salir" type="button">Cerrar sesión</button>
  </header>

  <main>
    <h1>Mis recetas</h1>
    <p>Página privada: solo se ve con la sesión iniciada.</p>
    <a href="nueva-receta.html" class="boton">+ Nueva receta</a>

    <!-- Aviso que aparece al volver de guardar una receta -->
    <p id="mensaje-exito" class="exito" hidden>Receta guardada correctamente.</p>
    <p id="mensaje-error" class="error" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const saludo = document.getElementById('saludo');
    const mensajeError = document.getElementById('mensaje-error');


    // -----------------------------------------------------------------
    // mostrarError(texto)
    // Qué hace: escribe el mensaje en el párrafo de error y lo muestra.
    // -----------------------------------------------------------------
    function mostrarError(texto) {
      mensajeError.textContent = texto;
      mensajeError.hidden = false;
    }


    // -----------------------------------------------------------------
    // mostrarAvisoSiSeGuardo()
    // Qué hace: si la página se abrió con ?guardada=1 (viene de guardar
    //           una receta), muestra el aviso verde.
    //
    // URLSearchParams lee los parámetros que van después del "?" en la
    // dirección. history.replaceState limpia la dirección para que el
    // aviso no vuelva a aparecer si se recarga la página.
    // -----------------------------------------------------------------
    function mostrarAvisoSiSeGuardo() {
      const parametros = new URLSearchParams(window.location.search);

      if (parametros.get('guardada') === '1') {
        document.getElementById('mensaje-exito').hidden = false;
        history.replaceState(null, '', 'app.html');
      }
    }


    // -----------------------------------------------------------------
    // iniciarPagina()
    // Qué hace: 1) verifica la sesión (sin sesión, vuelve al inicio);
    //           2) lee el perfil y saluda con el nombre;
    //           3) muestra el aviso de "receta guardada" si corresponde.
    //
    // Leer el perfil prueba tres cosas a la vez: que el trigger creó el
    // perfil al registrarse, que la política RLS deja ver el perfil
    // propio y que la conexión con la base funciona.
    // -----------------------------------------------------------------
    async function iniciarPagina() {
      const sesion = await protegerPagina();
      if (!sesion) return;

      const { data: perfil, error } = await supabaseClient
        .from('perfiles')
        .select('nombre')
        .eq('id', sesion.user.id)
        .single();

      if (error) {
        console.error(error);
        mostrarError('Sesión iniciada, pero no se pudo leer el perfil: ' + error.message);
        saludo.textContent = sesion.user.email;
        return;
      }

      saludo.textContent = 'Hola, ' + perfil.nombre;
      mostrarAvisoSiSeGuardo();
    }


    // EVENTOS
    document.getElementById('btn-salir').addEventListener('click', cerrarSesion);

    // Arranque de la página.
    iniciarPagina().catch((error) => {
      console.error(error);
      mostrarError('Ocurrió un error al cargar la página.');
    });
  </script>
</body>
</html>
