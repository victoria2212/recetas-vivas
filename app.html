<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetas Vivas · Mis recetas</title>
  <link rel="stylesheet" href="css/styles.css">

  <script src="js/preferencias.js" defer></script>
  <script src="js/tema.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/recetas.js" defer></script>
  <script src="js/perfil.js" defer></script>
  <script src="js/historial-busquedas.js" defer></script>
  <script src="js/listado.js" defer></script>
</head>
<body>
  <header>
    <span id="saludo">Cargando...</span>
    <div class="acciones-encabezado">
      <button id="btn-tema" class="boton-icono" type="button" aria-label="Modo oscuro" aria-pressed="false" title="Modo oscuro">
        <svg class="icono-luna" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icono-sol" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="btn-salir" type="button">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <!-- portada del emprendimiento, la completa listado.js -->
    <section id="portada" class="portada" aria-label="Mi emprendimiento" hidden>
      <div id="portada-logo" class="portada-logo"></div>
      <div class="portada-texto">
        <p id="portada-nombre" class="portada-nombre"></p>
        <p id="portada-frase" class="portada-frase"></p>
      </div>
      <a id="portada-editar" href="configuracion.html" class="boton">Editar</a>
    </section>

    <div class="encabezado-listado">
      <h1>Mis recetas</h1>
      <a href="nueva-receta.html" class="boton">+ Nueva receta</a>
    </div>

    <p id="mensaje-exito" class="exito" hidden></p>
    <p id="mensaje-error" class="error" hidden></p>

    <div class="barra-herramientas">
      <div id="contenedor-buscador" class="contenedor-buscador">
        <label for="buscador" class="oculto-visual">Buscar recetas</label>
        <input id="buscador" type="search" placeholder="Buscar por título..." autocomplete="off">

        <ul id="historial-busquedas" class="historial-busquedas" aria-label="Búsquedas recientes" hidden></ul>
      </div>

      <label class="control-orden">
        Ordenar
        <select id="orden">
          <option value="recientes">Más recientes</option>
          <option value="az">Nombre A–Z</option>
          <option value="za">Nombre Z–A</option>
        </select>
      </label>
    </div>

    <p id="estado-carga" class="estado" hidden>Cargando recetas...</p>

    <div id="error-listado" class="estado" hidden>
      <p id="texto-error-listado" class="error"></p>
      <button id="btn-reintentar" type="button">Reintentar</button>
    </div>

    <p id="sin-recetas" class="estado" hidden>
      Todavía no tiene recetas. Empiece con "+ Nueva receta".
    </p>

    <p id="sin-resultados" class="estado" hidden></p>

    <!-- las tarjetas las arma listado.js -->
    <div id="lista-recetas" class="grilla-recetas"></div>
  </main>

</body>
</html>
